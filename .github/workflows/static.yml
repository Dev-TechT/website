# Validate and deploy static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: '23 14 * * *'

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate static site
        run: python3 scripts/check_static_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Sentinel Swarm
        run: node --test scripts/check_sentinel_swarm.js

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build Pages artifact directory
        run: |
          set -euo pipefail
          bash scripts/build_pages.sh
          if ! timeout 120s python3 scripts/build_sentinel_kev.py --with-epss _site/labs/sentinel-swarm/data/kev.json; then
            if [[ "${{ github.event_name }}" == schedule ]]; then
              exit 1  # Leave the currently served release intact.
            fi
            echo '::warning::Feed refresh failed; deploying the bundled dated snapshot.'
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
